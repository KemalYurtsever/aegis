name: aegis

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/monitoring.db
      AEGIS_BACKUP_DIRECTORY: /data/backups
      AEGIS_BACKUP_INCLUDE_CVE_MIRROR: ${AEGIS_BACKUP_INCLUDE_CVE_MIRROR:-false}
      AEGIS_REPORT_DIRECTORY: /data/reports
      AEGIS_ATTACHMENT_DIRECTORY: /data/attachments
      AEGIS_PROMETHEUS_TOKEN_FILE: /run/secrets/prometheus_token
      AEGIS_SMTP_PASSWORD: ${AEGIS_SMTP_PASSWORD:-}
      AEGIS_TEAMS_WEBHOOK_URL: ${AEGIS_TEAMS_WEBHOOK_URL:-}
      AEGIS_TWILIO_ACCOUNT_SID: ${AEGIS_TWILIO_ACCOUNT_SID:-}
      AEGIS_TWILIO_AUTH_TOKEN: ${AEGIS_TWILIO_AUTH_TOKEN:-}
      AEGIS_SNMP_COMMUNITY: ${AEGIS_SNMP_COMMUNITY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
    secrets:
      - prometheus_token
    volumes:
      - aegis_data:/data
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-http://127.0.0.1:3000}
        VITE_WIRESHARK_URL: ${VITE_WIRESHARK_URL:-https://127.0.0.1:8444/}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    secrets:
      - prometheus_token
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

secrets:
  prometheus_token:
    file: ./secrets/prometheus_token.txt

volumes:
  aegis_data:
  prometheus_data:
  grafana_data:
