name: Repository privacy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Privacy guard tests
        run: python3 tools/test_repository_privacy.py
      - name: Scan all reachable publication history
        run: python3 tools/repository_privacy.py --history HEAD
