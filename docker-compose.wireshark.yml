name: aegis-wireshark

# Standalone optional GUI. It joins the running toolbox namespace without
# recreating the toolbox or interrupting scans. Only the TLS TCP proxy is
# published; neither the unencrypted GUI port nor its websocket port is exposed.
services:
  wireshark:
    image: lscr.io/linuxserver/wireshark@sha256:1cd396962fb8697e1105feb9d976a0b059362a3e4255a106a7a30bc6dab297ed
    container_name: aegis-wireshark
    network_mode: "container:${AEGIS_NETWORK_TOOLBOX_CONTAINER:-aegis-network-tools}"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Istanbul
      CUSTOM_USER: aegis
      FILE__PASSWORD: /run/secrets/wireshark_password
      SELKIES_UI_TITLE: Aegis Wireshark
      SELKIES_COMMAND_ENABLED: "false|locked"
      SELKIES_ENABLE_SHARING: "false|locked"
      SELKIES_UI_SIDEBAR_SHOW_APPS: "false|locked"
      SELKIES_UI_SIDEBAR_SHOW_SHARING: "false|locked"
      SELKIES_AUDIO_ENABLED: "false|locked"
      SELKIES_MICROPHONE_ENABLED: "false|locked"
      SELKIES_GAMEPAD_ENABLED: "false|locked"
      SELKIES_CLIPBOARD_ENABLED: "false|locked"
      SELKIES_FILE_TRANSFERS: "upload,download|locked"
    secrets:
      - wireshark_password
    volumes:
      - wireshark_data:/config
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2
    labels:
      aegis.wireshark.managed: "true"
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl -k -s -o /dev/null -w '%{http_code}' --max-time 3 https://127.0.0.1:3001/)\" = 401"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  wireshark-proxy:
    image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: aegis-wireshark-proxy
    restart: unless-stopped
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - ./deploy/wireshark/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${AEGIS_WIRESHARK_PORT:-8444}:8444"
    networks:
      - toolbox_network
    depends_on:
      wireshark:
        condition: service_healthy
    labels:
      aegis.wireshark.managed: "true"

secrets:
  wireshark_password:
    file: ./secrets/wireshark_password.txt

volumes:
  wireshark_data:

networks:
  toolbox_network:
    external: true
    name: ${AEGIS_WIRESHARK_NETWORK:-aegis_default}
