# The pinned official Nginx image compiles stream support into the binary.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

# Preserve the GUI's own TLS and Basic authentication end to end.
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream wireshark_tls {
        zone wireshark_tls 64k;
        server aegis-network-tools:3001 resolve;
    }
    server {
        listen 8444;
        proxy_connect_timeout 3s;
        proxy_timeout 3600s;
        proxy_pass wireshark_tls;
    }
}
