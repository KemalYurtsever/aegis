apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegis
resources:
  - namespace.yaml
  - secret.yaml
  - storage.yaml
  - backend.yaml
  - frontend.yaml
  - observability.yaml
  - ingress.yaml
configMapGenerator:
  # Kustomize restricts file sources to this directory; keep these copies in
  # sync with deploy/grafana when changing observability configuration.
  - name: grafana-datasource
    files:
      - prometheus.yml=grafana/prometheus.yml
  - name: grafana-dashboard-provider
    files:
      - aegis.yml=grafana/aegis.yml
  - name: grafana-dashboard
    files:
      - aegis-overview.json=grafana/aegis-overview.json
