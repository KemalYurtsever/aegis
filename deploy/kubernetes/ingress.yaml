apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: liims
  namespace: liims
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  rules:
    - host: liims.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {name: http}}
