name: aegis

services:
  network-toolbox:
    build:
      context: ./deploy/network-toolbox
    container_name: aegis-network-tools
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/dbus
      - /run/avahi-daemon:uid=101,gid=102,mode=0755
    environment:
      HOME: /
      XDG_CONFIG_HOME: /tmp/xdg/config
      XDG_STATE_HOME: /tmp/xdg/state
      XDG_CACHE_HOME: /tmp/xdg/cache
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    secrets:
      - prometheus_token
    volumes:
      - ./deploy/prometheus/prometheus-windows-host.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

secrets:
  prometheus_token:
    file: ./secrets/prometheus_token.txt

volumes:
  prometheus_data:
  grafana_data:
